<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --text: #1d1d1b; --muted: #77766f;
    --user: #1d1d1b; --user-text: #ffffff; --bot: #ecebe6; --accent: #2f6fed;
    --err-bg: #fdecea; --err-text: #8a1c14; --line: #dedcd5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --panel: #1e1e1c; --text: #ecebe6; --muted: #8e8d86;
      --user: #ecebe6; --user-text: #151514; --bot: #2a2a27; --accent: #6b9bff;
      --err-bg: #3a1a17; --err-text: #ffb4ab; --line: #333330;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }
  .app { width: 100%; max-width: 720px; height: 100%; display: flex; flex-direction: column; }
  header { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 10px; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
  header span { color: var(--muted); font-size: 13px; }
  header { position: relative; }
  #menuBtn { margin-left: auto; padding: 6px 12px; background: transparent; color: var(--muted); border: 1px solid var(--line); font-size: 16px; line-height: 1; }
  #menu { position: absolute; right: 16px; top: 54px; z-index: 5; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px; display: flex; flex-direction: column; min-width: 170px; box-shadow: 0 6px 20px rgba(0,0,0,.15); }
  #menu button { background: transparent; color: var(--text); text-align: left; font-weight: 500; padding: 10px 12px; }
  #menu button:hover { background: var(--bg); }
  #menu .danger { color: var(--err-text); }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .err { align-self: flex-start; background: var(--err-bg); color: var(--err-text); font-size: 14px; }
  .thinking { color: var(--muted); font-style: italic; }
  .empty { margin: auto; color: var(--muted); text-align: center; padding: 24px; }
  form.chat { display: flex; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--panel); }
  textarea, input[type=password] {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 12px; outline: none; padding: 10px 12px;
  }
  textarea { flex: 1; resize: none; max-height: 140px; }
  textarea:focus, input[type=password]:focus { border-color: var(--accent); }
  button {
    font: inherit; font-weight: 600; padding: 10px 18px; border: 0; border-radius: 12px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  #lock {
    position: fixed; inset: 0; background: var(--bg); z-index: 10;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  #lock form { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; }
  #lock h2 { margin: 0; font-size: 20px; }
  #lockMsg { margin: 0; color: var(--err-text); font-size: 14px; min-height: 1.2em; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Jarvis</h1><span>personal assistant</span>
    <button id="menuBtn" type="button" aria-label="Settings" aria-expanded="false">&#9881;</button>
    <div id="menu" hidden>
      <button id="clearBtn" type="button" class="danger">Clear chat</button>
      <button id="logoutBtn" type="button">Log out</button>
    </div>
  </header>
  <div id="log" aria-live="polite"></div>
  <form class="chat" id="form">
    <textarea id="input" rows="1" placeholder="Message Jarvis…  (Enter to send, Shift+Enter for new line)"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</div>

<div id="lock" hidden>
  <form id="lockForm">
    <h2>Jarvis</h2>
    <input id="pwInput" type="password" placeholder="Password" autocomplete="current-password">
    <p id="lockMsg"></p>
    <button type="submit">Unlock</button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const lock = document.getElementById("lock");
const lockForm = document.getElementById("lockForm");
const pwInput = document.getElementById("pwInput");
const lockMsg = document.getElementById("lockMsg");

let pw = "";
try { pw = localStorage.getItem("jarvis_pw") || ""; } catch (e) {}

function api(path, opts) {
  opts = opts || {};
  const headers = Object.assign({}, opts.headers || {});
  if (pw) headers["X-Jarvis-Password"] = pw;
  return fetch(path, Object.assign({}, opts, { headers }));
}

function showLock(msg) {
  lockMsg.textContent = msg || "";
  lock.hidden = false;
  pwInput.value = "";
  pwInput.focus();
}

function add(kind, text) {
  const empty = log.querySelector(".empty");
  if (empty) empty.remove();
  const el = document.createElement("div");
  el.className = "msg " + kind;
  el.textContent = text;          // textContent: never interpreted as HTML
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

async function loadHistory() {
  log.textContent = "";
  try {
    const res = await api("/api/history");
    if (res.status === 401) { showLock(pw ? "Wrong password." : ""); return; }
    const data = await res.json();
    if (!res.ok) { add("err", data.error || "Could not load history."); return; }
    data.messages.forEach(m => add(m.role === "user" ? "user" : "bot", m.content));
  } catch (e) {
    add("err", "Can't reach Jarvis.");
    return;
  }
  if (!log.children.length) {
    const d = document.createElement("div");
    d.className = "empty";
    d.textContent = "Say something to Jarvis.";
    log.appendChild(d);
  }
  input.focus();
}

lockForm.addEventListener("submit", (ev) => {
  ev.preventDefault();
  pw = pwInput.value;
  try { localStorage.setItem("jarvis_pw", pw); } catch (e) {}
  lock.hidden = true;
  loadHistory();
});

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text || send.disabled) return;
  input.value = ""; input.style.height = "auto";
  add("user", text);
  const wait = add("bot thinking", "thinking…");
  send.disabled = true;
  try {
    const res = await api("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    const data = await res.json();
    wait.remove();
    if (res.status === 401) { input.value = text; showLock("Password needed."); }
    else if (res.ok) add("bot", data.reply);
    else add("err", data.error || "Something went wrong.");
  } catch (e) {
    wait.remove();
    add("err", "Can't reach Jarvis. Check your connection (or that web.py is still running).");
  }
  send.disabled = false;
  input.focus();
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
});

// ---- settings menu: clear chat + log out ----
const menu = document.getElementById("menu");
const menuBtn = document.getElementById("menuBtn");

function setMenu(open) {
  menu.hidden = !open;
  menuBtn.setAttribute("aria-expanded", open ? "true" : "false");
}
menuBtn.addEventListener("click", (e) => { e.stopPropagation(); setMenu(menu.hidden); });
document.addEventListener("click", (e) => { if (!menu.contains(e.target)) setMenu(false); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") setMenu(false); });

document.getElementById("clearBtn").addEventListener("click", async () => {
  setMenu(false);
  if (!confirm("Clear this chat? Jarvis keeps the long-term facts it has saved.")) return;
  try {
    const res = await api("/api/clear", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: "{}",
    });
    if (res.status === 401) { showLock("Password needed."); return; }
    const data = await res.json();
    if (!res.ok) { add("err", data.error || "Could not clear the chat."); return; }
  } catch (e) {
    add("err", "Can't reach Jarvis.");
    return;
  }
  loadHistory();
});

document.getElementById("logoutBtn").addEventListener("click", () => {
  setMenu(false);
  pw = "";
  try { localStorage.removeItem("jarvis_pw"); } catch (e) {}
  log.textContent = "";      // do not leave the conversation on screen
  showLock("");
});

loadHistory();
</script>
</body>
</html>
